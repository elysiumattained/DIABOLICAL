<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIABOLICAL - Dice Roller</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #1a1a2e;
    color: #eee;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }

  h1 {
    font-size: 2rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 0.25rem;
    color: #c4a35a;
  }

  .subtitle {
    font-size: 0.85rem;
    color: #888;
    margin-bottom: 2rem;
    letter-spacing: 0.05em;
  }

  /* ---- Setup controls ---- */
  #setup {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    width: 100%;
    max-width: 480px;
  }

  .control-group {
    width: 100%;
    text-align: center;
  }

  .control-group label {
    display: block;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #aaa;
    margin-bottom: 0.6rem;
  }

  .picker-row {
    display: flex;
    gap: 0.4rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .picker-btn {
    width: 40px;
    height: 40px;
    border: 2px solid #444;
    border-radius: 8px;
    background: transparent;
    color: #999;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, color 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .picker-btn:hover {
    border-color: #c4a35a;
    color: #eee;
    background: rgba(196,163,90,0.1);
  }
  .picker-btn.filled {
    border-color: #c4a35a;
    background: rgba(196,163,90,0.15);
    color: #c4a35a;
  }
  .picker-btn.selected {
    border-color: #c4a35a;
    background: rgba(196,163,90,0.3);
    color: #c4a35a;
    font-weight: 700;
  }

  .picker-btn.hunger-btn:hover {
    border-color: #d44;
    color: #eee;
    background: rgba(221,68,68,0.1);
  }
  .picker-btn.hunger-btn.filled {
    border-color: #d44;
    background: rgba(221,68,68,0.15);
    color: #d44;
  }
  .picker-btn.hunger-btn.selected {
    border-color: #d44;
    background: rgba(221,68,68,0.3);
    color: #d44;
    font-weight: 700;
  }

  .dice-preview {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    flex-wrap: wrap;
    min-height: 44px;
    margin-top: 0.25rem;
  }

  .preview-die {
    width: 36px;
    height: 36px;
    border: 2px solid #555;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    color: #888;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
  }
  .preview-die.hunger {
    border-color: #d44;
    background: rgba(221,68,68,0.15);
    color: #d44;
  }

  #roll-btn {
    margin-top: 0.5rem;
    padding: 0.75rem 2.5rem;
    border: none;
    border-radius: 8px;
    background: #c4a35a;
    color: #1a1a2e;
    font-size: 1.1rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  #roll-btn:hover { background: #d4b36a; }
  #roll-btn:active { transform: scale(0.97); }
  #roll-btn:disabled { opacity: 0.4; cursor: default; }

  /* ---- Results ---- */
  #results {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 1.25rem;
    width: 100%;
    max-width: 500px;
  }

  .results-info {
    font-size: 0.85rem;
    color: #888;
    text-align: center;
  }

  .dice-tray {
    display: flex;
    gap: 0.75rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .die {
    width: 60px;
    height: 60px;
    border: 3px solid #555;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    user-select: none;
    position: relative;
  }

  .die:hover:not(.hunger):not(.rolling) {
    transform: translateY(-3px);
    box-shadow: 0 4px 12px rgba(196,163,90,0.3);
    border-color: #c4a35a;
  }

  /* Hunger dice: solid red background */
  .die.hunger {
    border-color: #b22;
    background: #c0392b;
    cursor: not-allowed;
  }

  /* Result highlighting */
  .die.success {
    color: #4caf50;
    border-color: #4caf50;
    text-shadow: 0 0 8px rgba(76,175,80,0.5);
  }

  .die.hunger.success {
    color: #4caf50;
    border-color: #b22;
    background: #c0392b;
    text-shadow: 0 0 8px rgba(76,175,80,0.6);
  }

  .die.bestial {
    color: #ff3333;
    border-color: #ff3333;
    text-shadow: 0 0 8px rgba(255,51,51,0.5);
  }

  .die.hunger.bestial {
    color: #1a1a2e;
    border-color: #ff3333;
    background: #c0392b;
    text-shadow: none;
  }

  .die.normal-result {
    color: #ccc;
  }

  .die.hunger.normal-result {
    color: #1a1a2e;
    background: #c0392b;
    border-color: #b22;
  }

  /* Roll animation */
  @keyframes tumble {
    0%   { transform: rotateZ(0deg)   scale(1);   }
    25%  { transform: rotateZ(90deg)  scale(1.1);  }
    50%  { transform: rotateZ(180deg) scale(1);    }
    75%  { transform: rotateZ(270deg) scale(1.1);  }
    100% { transform: rotateZ(360deg) scale(1);    }
  }

  .die.rolling {
    animation: tumble 0.4s ease-in-out;
    pointer-events: none;
  }

  .summary {
    text-align: center;
    font-size: 1rem;
    line-height: 1.6;
  }
  .summary .successes { color: #4caf50; font-weight: 700; font-size: 1.2rem; }

  #reset-btn {
    padding: 0.6rem 2rem;
    border: 2px solid #555;
    border-radius: 8px;
    background: transparent;
    color: #ccc;
    font-size: 0.95rem;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  #reset-btn:hover { border-color: #c4a35a; color: #c4a35a; }
</style>
</head>
<body>

<h1>Diabolical</h1>
<p class="subtitle">Dice Roller</p>

<!-- Setup Screen -->
<div id="setup">
  <div class="control-group">
    <label>Dice Pool (d6)</label>
    <div class="picker-row" id="total-picker"></div>
  </div>

  <div class="control-group">
    <label>Hunger Dice</label>
    <div class="picker-row" id="hunger-picker"></div>
  </div>

  <div class="dice-preview" id="dice-preview"></div>

  <button id="roll-btn" onclick="rollDice()">Roll</button>
</div>

<!-- Results Screen -->
<div id="results">
  <div class="results-info">Click a die to reroll it. <span style="color:#d44;">Hunger dice</span> cannot be rerolled.</div>
  <div class="dice-tray" id="dice-tray"></div>
  <div class="summary" id="summary"></div>
  <button id="reset-btn" onclick="resetToSetup()">New Roll</button>
</div>

<script>
  let totalDice = 1;
  let hungerDice = 0;
  let diceResults = []; // { value, isHunger }

  function buildPickers() {
    const totalPicker = document.getElementById('total-picker');
    const hungerPicker = document.getElementById('hunger-picker');
    totalPicker.innerHTML = '';
    hungerPicker.innerHTML = '';

    for (let i = 1; i <= 10; i++) {
      const btn = document.createElement('button');
      btn.className = 'picker-btn';
      btn.textContent = i;
      if (i < totalDice) btn.classList.add('filled');
      if (i === totalDice) btn.classList.add('selected');
      btn.addEventListener('click', () => setTotal(i));
      totalPicker.appendChild(btn);
    }

    const maxHunger = Math.min(5, totalDice);
    for (let i = 0; i <= maxHunger; i++) {
      const btn = document.createElement('button');
      btn.className = 'picker-btn hunger-btn';
      btn.textContent = i;
      if (i > 0 && i < hungerDice) btn.classList.add('filled');
      if (i === hungerDice) btn.classList.add('selected');
      btn.addEventListener('click', () => setHunger(i));
      hungerPicker.appendChild(btn);
    }
  }

  function setTotal(n) {
    totalDice = n;
    const maxHunger = Math.min(5, totalDice);
    if (hungerDice > maxHunger) hungerDice = maxHunger;
    updateSetupUI();
  }

  function setHunger(n) {
    hungerDice = n;
    updateSetupUI();
  }

  function updateSetupUI() {
    buildPickers();

    const preview = document.getElementById('dice-preview');
    preview.innerHTML = '';
    const normalCount = totalDice - hungerDice;
    for (let i = 0; i < normalCount; i++) {
      const d = document.createElement('div');
      d.className = 'preview-die';
      d.textContent = 'd6';
      preview.appendChild(d);
    }
    for (let i = 0; i < hungerDice; i++) {
      const d = document.createElement('div');
      d.className = 'preview-die hunger';
      d.textContent = 'd6';
      preview.appendChild(d);
    }
  }

  function rollValue() {
    return Math.floor(Math.random() * 6) + 1;
  }

  function rollDice() {
    diceResults = [];
    const normalCount = totalDice - hungerDice;
    for (let i = 0; i < normalCount; i++) {
      diceResults.push({ value: rollValue(), isHunger: false });
    }
    for (let i = 0; i < hungerDice; i++) {
      diceResults.push({ value: rollValue(), isHunger: true });
    }

    document.getElementById('setup').style.display = 'none';
    document.getElementById('results').style.display = 'flex';
    renderResults(true);
  }

  function applyDieClasses(el, die) {
    if (die.isHunger) el.classList.add('hunger');

    if (die.value >= 5) {
      el.classList.add('success');
    } else if (die.value === 1) {
      el.classList.add('bestial');
    } else {
      el.classList.add('normal-result');
    }
  }

  function renderResults(animate) {
    const tray = document.getElementById('dice-tray');
    tray.innerHTML = '';

    diceResults.forEach((die, idx) => {
      const el = document.createElement('div');
      el.className = 'die';
      el.textContent = die.value;

      applyDieClasses(el, die);

      if (animate) el.classList.add('rolling');

      if (!die.isHunger) {
        el.addEventListener('click', () => rerollDie(idx));
      }

      tray.appendChild(el);
    });

    if (animate) {
      setTimeout(() => {
        tray.querySelectorAll('.rolling').forEach(el => el.classList.remove('rolling'));
      }, 400);
    }

    updateSummary();
  }

  function rerollDie(idx) {
    const die = diceResults[idx];
    if (die.isHunger) return;

    die.value = rollValue();

    const tray = document.getElementById('dice-tray');
    const el = tray.children[idx];
    el.textContent = die.value;
    el.className = 'die';

    applyDieClasses(el, die);

    el.classList.add('rolling');
    setTimeout(() => el.classList.remove('rolling'), 400);

    updateSummary();
  }

  function updateSummary() {
    const hits = diceResults.filter(d => d.value >= 5).length;
    const misses = diceResults.filter(d => d.value === 1).length;
    const net = Math.max(0, hits - misses);
    const hungerOnes = diceResults.filter(d => d.isHunger && d.value === 1).length;

    let html = `<span class="successes">${net} Net ${net === 1 ? 'Success' : 'Successes'}</span>`;
    html += `<br><span style="color:#aaa;">${hits} ${hits === 1 ? 'hit' : 'hits'}</span>`;
    if (misses > 0) {
      html += ` <span style="color:#ff3333;">&#8722; ${misses} ${misses === 1 ? 'miss' : 'misses'}</span>`;
    }
    if (hungerOnes > 0) {
      html += `<br><span style="color:#ff3333;">(${hungerOnes} on hunger)</span>`;
    }

    document.getElementById('summary').innerHTML = html;
  }

  function resetToSetup() {
    document.getElementById('results').style.display = 'none';
    document.getElementById('setup').style.display = 'flex';
    diceResults = [];
  }

  // Initial render
  updateSetupUI();
</script>

</body>
</html>
